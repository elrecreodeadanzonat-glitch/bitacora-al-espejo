var b64=function(s){var b=atob(s),a=new Uint8Array(b.length);for(var i=0;i<b.length;i++)a[i]=b.charCodeAt(i);return a};
var norm=function(s){return String(s).normalize('NFD').replace(/[\u0300-\u036f]/g,'').toLowerCase().replace(/\s+/g,'')};
var LS='bae_llave_'+CFG.salt.slice(0,8);
function derivar(clave){return crypto.subtle.importKey('raw',new TextEncoder().encode(norm(clave)),'PBKDF2',false,['deriveBits']).then(function(k){return crypto.subtle.deriveBits({name:'PBKDF2',salt:b64(CFG.salt),iterations:CFG.iter,hash:'SHA-256'},k,256)})}
function descifrar(raw){return crypto.subtle.importKey('raw',raw,'AES-GCM',false,['decrypt']).then(function(k){return crypto.subtle.decrypt({name:'AES-GCM',iv:b64(CFG.iv)},k,b64(CT))}).then(function(buf){return new TextDecoder().decode(buf)})}
function cuandoListo(fn){if(document.readyState==='complete')fn();else window.addEventListener('load',fn,{once:true})}
function mostrar(texto){cuandoListo(function(){pintar(texto)})}
function pintar(texto){
