var b64=function(s){var b=atob(s),a=new Uint8Array(b.length);for(var i=0;i<b.length;i++)a[i]=b.charCodeAt(i);return a};
var norm=function(s){return String(s).normalize('NFD').replace(/[\u0300-\u036f]/g,'').toLowerCase().replace(/\s+/g,'')};
var LS='bae_llave_'+CFG.salt.slice(0,8);
function derivar(clave){return crypto.subtle.importKey('raw',new TextEncoder().encode(norm(clave)),'PBKDF2',false,['deriveBits']).then(function(k){return crypto.subtle.deriveBits({name:'PBKDF2',salt:b64(CFG.salt),iterations:CFG.iter,hash:'SHA-256'},k,256)})}
function descifrar(raw){return crypto.subtle.importKey('raw',raw,'AES-GCM',false,['decrypt']).then(function(k){return crypto.subtle.decrypt({name:'AES-GCM',iv:b64(CFG.iv)},k,b64(CT))}).then(function(buf){return new TextDecoder().decode(buf)})}
function cuandoListo(fn){if(document.readyState==='complete')fn();else window.addEventListener('load',fn,{once:true})}
function mostrar(texto){cuandoListo(function(){pintar(texto)})}
function pintar(texto){
  if(CFG.kind==='html'){document.open();document.write(texto);document.close();return}
  var esc=texto.replace(/[&<>]/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;'}[c]});
  document.open();document.write('<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>'+CFG.nombre+'</title><style>body{margin:0;background:#f6f5f1;color:#121417;font:14px/1.5 ui-monospace,Consolas,monospace;padding:16px}@media(prefers-color-scheme:dark){body{background:#0f1114;color:#eceef1}}.t{display:flex;gap:12px;align-items:center;flex-wrap:wrap;font:600 15px system-ui,sans-serif;margin-bottom:12px}button{font:600 13px system-ui,sans-serif;padding:6px 12px;border-radius:8px;border:1px solid #2a78d6;background:#2a78d6;color:#fff;cursor:pointer}pre{white-space:pre-wrap;word-break:break-word;margin:0}</style></head><body><div class="t"><span>'+CFG.nombre+'</span><button id="d">Descargar</button></div><pre id="p"></pre></body></html>');document.close();
  document.getElementById('p').textContent=texto;
  document.getElementById('d').onclick=function(){var a=document.createElement('a');a.href=URL.createObjectURL(new Blob([texto],{type:'text/plain;charset=utf-8'}));a.download=CFG.nombre;document.body.appendChild(a);a.click();setTimeout(function(){URL.revokeObjectURL(a.href);a.remove()},1000)};
}
function intentar(raw,guardar){return descifrar(raw).then(function(t){if(guardar){try{localStorage.setItem(LS,btoa(String.fromCharCode.apply(null,new Uint8Array(raw))))}catch(e){}}mostrar(t);return true}).catch(function(){return false})}
var e=document.getElementById('e'),b=document.getElementById('b'),c=document.getElementById('c');
document.getElementById('v').onclick=function(){c.type=c.type==='password'?'text':'password';this.textContent=c.type==='password'?'Ver':'Ocultar'};
document.getElementById('f').onsubmit=function(ev){ev.preventDefault();if(!c.value.trim())return;b.disabled=true;b.textContent='Abriendo…';e.textContent='';
  derivar(c.value).then(function(raw){return intentar(raw,true)}).then(function(ok){if(!ok){e.textContent='Esa no es la clave. Revísala o pregúntale a Andrés.';b.disabled=false;b.textContent='Entrar';c.select()}}).catch(function(){e.textContent='Este navegador no puede abrir la página (necesita HTTPS y un navegador actual).';b.disabled=false;b.textContent='Entrar'})};
try{var g=localStorage.getItem(LS);if(g){intentar(b64(g).buffer,false)}}catch(x){}
})();
